<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Travel Pro - Saved itineraries">
  <title>My Itineraries — Travel Pro</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>!function () { var t = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', t); }();</script>
</head>

<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">✈</div>
        <span>Travel<span class="text-orange">Pro</span></span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <button class="btn btn-primary btn-sm mobile-auth-btn" data-auth="login" style="display:none;">Login</button>
      </div>
      <div class="nav-actions">
        <span class="nav-time" id="nav-datetime"></span>
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
        <button class="btn btn-outline btn-sm" data-auth="login">Login</button>
        <button class="btn btn-primary btn-sm" data-auth="signup">Sign Up</button>
        <div class="user-menu" style="display:none;cursor:pointer;" onclick="openProfilePanel()">
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.85rem;">
            <span class="user-name">U</span>
          </div>
        </div>
      </div>
      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <h1>My <span style="color:rgba(255,255,255,0.8)">Itineraries</span></h1>
    <p>View and manage the itineraries you saved.</p>
  </section>

  <section class="section" id="itinerary-page">
    <div class="container">
      <div class="contact-grid" style="grid-template-columns: 1.1fr 1.4fr;">
        <div class="contact-form" style="margin:0;">
          <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:10px;">Saved Itineraries</h2>
          <div id="itinerary-list" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
        <div class="contact-form" style="margin:0;">
          <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:10px;">Itinerary Details</h2>
          <div id="itinerary-detail" style="color:var(--text-light);">Select an itinerary to view details.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- AUTH MODAL (reused) -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close">✕</button>
      <h2>Welcome to Travel<span class="text-orange">Pro</span></h2>
      <p>Sign in to access your personalized travel dashboard</p>
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Login</div>
        <div class="auth-tab" data-tab="signup">Sign Up</div>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-input" name="login-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" name="login-password" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Login</button>
      </form>
      <form id="signup-form" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-input" name="signup-name" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-input" name="signup-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-input" name="signup-password" placeholder="Min 6 characters">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="../js/script.js"></script>
</body>

</html>
