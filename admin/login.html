<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Travel Pro Admin - Login">
  <title>Admin Login — Travel Pro</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>!function () { var t = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', t); }();</script>
</head>

<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">
        <div class="logo-icon">✈</div>
        <span>Travel<span class="text-orange">Pro</span> <span style="opacity:.7;font-weight:700">Admin</span></span>
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container" style="max-width:520px;">
      <div class="contact-form" style="margin:0 auto;">
        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;">Admin Login</h2>
        <p style="color:var(--text-light);margin-bottom:24px;font-size:0.9rem;">Use your admin email and password.</p>

        <div class="form-message" id="admin-login-msg" style="display:none;"></div>

        <form id="admin-login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-input" name="email" placeholder="admin@example.com">
            <div class="form-error"></div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-input" name="password" placeholder="Enter your password">
            <div class="form-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
            Login
          </button>
        </form>
      </div>
    </div>
  </section>

  <script src="../js/script.js"></script>
  <script src="../js/admin.js"></script>
</body>

</html>
